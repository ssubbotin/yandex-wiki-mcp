[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yandex-wiki-mcp-server"
version = "0.1.0"
description = "MCP server for Yandex Wiki"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
yandex-wiki-mcp-server = "yandex_wiki_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_wiki_mcp"]
